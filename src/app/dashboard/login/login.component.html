<div class="flex items-center justify-center m-auto min-h-screen ">
    <form [formGroup]="userForm" class="w-full max-w-md bg-white p-6 shadow-lg rounded-lg">
        <!-- Name Field -->
        <div class="mb-4">
            <label for="name" class="block text-gray-700 font-medium mb-2">الاسم <span
                    class="text-red-500">*</span></label>
            <input id="name" type="text" formControlName="mobile"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2"
                [ngClass]="{'border-red-500': userForm.get('name')?.invalid && userForm.get('name')?.touched}" />

            <div *ngIf="userForm.get('name')?.invalid && userForm.get('name')?.touched"
                class="text-red-500 text-sm mt-1">
                <span *ngIf="userForm.get('name')?.errors?.['required']">الاسم مطلوب</span>
            </div>
        </div>

        <!-- Mobile Field -->
        <div class="mb-4">
            <label for="mobile" class="block text-gray-700 font-medium mb-2">رقم الجوال <span
                    class="text-red-500">*</span></label>
            <input id="mobile" type="tel" formControlName="password"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2"
                [ngClass]="{'border-red-500': userForm.get('mobile')?.invalid && userForm.get('mobile')?.touched}" />

            <div *ngIf="userForm.get('mobile')?.invalid && userForm.get('mobile')?.touched"
                class="text-red-500 text-sm mt-1">
                <span *ngIf="userForm.get('mobile')?.errors?.['required']">رقم الجوال مطلوب</span>
                <span *ngIf="userForm.get('mobile')?.errors?.['pattern']">رقم الجوال غير صحيح</span>
            </div>
        </div>

        <!-- Submit Button -->
        <button matStepperNext type="submit" (click)="login() "
            class="w-full text-center bg-black text-white py-2 px-4 rounded-lg hover:bg-[#B97500] transition duration-300"
            [disabled]="userForm.invalid">
            حفظ
        </button>

    </form>

</div>
